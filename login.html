<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập — Nền tảng của bạn</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: {
      colors: { ink: '#090A14', primary: '#DF6B33', 'primary-light': '#F58A50' },
      fontFamily: { heading: ['Poppins', 'sans-serif'], body: ['Inter', 'sans-serif'] },
      boxShadow: { glow: '0 0 0 1px rgba(223,107,51,.12), 0 24px 80px rgba(0,0,0,.35)' }
    } } };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    html { color-scheme: dark; } body { background: #090A14; }
    .input-field:focus-within { box-shadow: 0 0 0 3px rgba(223,107,51,.14); }
    .social-button:hover { border-color: rgba(223,107,51,.65); background: rgba(223,107,51,.08); }
  </style>
</head>
<body class="min-h-screen bg-ink font-body text-slate-100 antialiased">
  <main class="relative flex min-h-screen items-center justify-center overflow-hidden px-4 py-8 sm:px-6">
    <div aria-hidden="true" class="pointer-events-none absolute -left-32 -top-32 h-80 w-80 rounded-full bg-primary/10 blur-3xl"></div>
    <div aria-hidden="true" class="pointer-events-none absolute -bottom-40 -right-32 h-96 w-96 rounded-full bg-primary/10 blur-3xl"></div>
    <section class="relative w-full max-w-md">
      <header class="mb-8 text-center sm:mb-10">
        <div class="mx-auto mb-5 flex h-12 w-12 items-center justify-center rounded-2xl bg-primary text-white shadow-lg shadow-primary/20" aria-hidden="true"><i data-lucide="sparkles" class="h-6 w-6"></i></div>
        <h1 class="font-heading text-2xl font-extrabold tracking-tight text-white sm:text-3xl">Chào mừng trở lại</h1>
        <p class="mt-2 text-sm leading-6 text-slate-400">Đăng nhập để tiếp tục sử dụng tài khoản của bạn</p>
      </header>
      <div class="rounded-2xl border border-white/[.08] bg-white/[.035] p-5 shadow-glow backdrop-blur-xl sm:rounded-3xl sm:p-8">
        <form id="login-form" novalidate class="space-y-5">
          <div>
            <label for="email" class="mb-2 block text-sm font-medium text-slate-200">Email</label>
            <div class="input-field flex items-center rounded-xl border border-white/[.12] bg-black/20 transition focus-within:border-primary"><i data-lucide="mail" class="ml-3.5 h-[18px] w-[18px] shrink-0 text-slate-500"></i><input id="email" type="email" autocomplete="email" required placeholder="ban@example.com" class="w-full min-w-0 bg-transparent px-3 py-3.5 text-sm text-white outline-none placeholder:text-slate-600" /></div>
            <p id="email-error" class="mt-1 flex min-h-4 items-center gap-1 text-xs text-red-400" aria-live="polite"></p>
          </div>
          <div>
            <div class="mb-2 flex items-center justify-between gap-3"><label for="password" class="block text-sm font-medium text-slate-200">Mật khẩu</label><a href="#quen-mat-khau" class="text-xs font-medium text-primary-light transition hover:text-white">Quên mật khẩu?</a></div>
            <div class="input-field flex items-center rounded-xl border border-white/[.12] bg-black/20 transition focus-within:border-primary"><i data-lucide="lock-keyhole" class="ml-3.5 h-[18px] w-[18px] shrink-0 text-slate-500"></i><input id="password" type="password" autocomplete="current-password" required placeholder="Nhập mật khẩu" class="w-full min-w-0 bg-transparent px-3 py-3.5 text-sm text-white outline-none placeholder:text-slate-600" /><button type="button" id="toggle-password" aria-label="Hiển thị mật khẩu" class="mr-2 rounded-lg p-2 text-slate-500 transition hover:text-slate-200"><i data-lucide="eye" class="h-[18px] w-[18px]"></i></button></div>
            <p id="password-error" class="mt-1 flex min-h-4 items-center gap-1 text-xs text-red-400" aria-live="polite"></p>
          </div>
          <label class="flex cursor-pointer items-center gap-2.5 text-sm text-slate-400"><input id="remember" type="checkbox" class="h-4 w-4 accent-primary focus:ring-2 focus:ring-primary/50" />Ghi nhớ đăng nhập</label>
          <button type="submit" class="flex w-full items-center justify-center gap-2 rounded-xl bg-primary px-4 py-3.5 text-sm font-semibold text-white shadow-lg shadow-primary/20 transition hover:bg-primary-light focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-ink active:scale-[.99]">Đăng nhập <i data-lucide="arrow-right" class="h-[18px] w-[18px]"></i></button>
        </form>
        <div class="my-7 flex items-center gap-3" aria-hidden="true"><div class="h-px flex-1 bg-white/[.1]"></div><span class="text-xs text-slate-500">Hoặc tiếp tục với</span><div class="h-px flex-1 bg-white/[.1]"></div></div>
        <div class="grid grid-cols-3 gap-2.5 sm:gap-3">
          <button type="button" class="social-button flex items-center justify-center gap-2 rounded-xl border border-white/[.12] bg-white/[.025] px-2 py-3 text-sm font-medium text-slate-200 transition" aria-label="Đăng nhập bằng Google"><i data-lucide="chrome" class="h-[18px] w-[18px]"></i><span class="hidden sm:inline">Google</span></button>
          <button type="button" class="social-button flex items-center justify-center gap-2 rounded-xl border border-white/[.12] bg-white/[.025] px-2 py-3 text-sm font-medium text-slate-200 transition" aria-label="Đăng nhập bằng GitHub"><i data-lucide="github" class="h-[18px] w-[18px]"></i><span class="hidden sm:inline">GitHub</span></button>
          <button type="button" class="social-button flex items-center justify-center gap-2 rounded-xl border border-white/[.12] bg-white/[.025] px-2 py-3 text-sm font-medium text-slate-200 transition" aria-label="Đăng nhập bằng Facebook"><i data-lucide="facebook" class="h-[18px] w-[18px]"></i><span class="hidden sm:inline">Facebook</span></button>
        </div>
      </div>
      <p class="mt-7 text-center text-sm text-slate-500">Chưa có tài khoản? <a href="register.html" class="font-semibold text-primary-light transition hover:text-white">Vui lòng đăng ký</a></p>
    </section>
  </main>
  <script>
    lucide.createIcons();
    const form = document.getElementById('login-form'), email = document.getElementById('email'), password = document.getElementById('password');
    const emailError = document.getElementById('email-error'), passwordError = document.getElementById('password-error');
    const setError = (element, message) => { element.textContent = ''; if (message) { element.innerHTML = '<i data-lucide="alert-triangle" class="h-3 w-3"></i>' + message; lucide.createIcons(); } };
    const validEmail = value => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
    const validate = () => { let valid = true; const emailValue = email.value.trim(); setError(emailError, !emailValue ? 'Email bắt buộc' : !validEmail(emailValue) ? 'Email không hợp lệ' : ''); setError(passwordError, !password.value.trim() ? 'Mật khẩu bắt buộc' : ''); if (!emailValue || !validEmail(emailValue) || !password.value.trim()) valid = false; return valid; };
    document.getElementById('toggle-password').addEventListener('click', event => { const visible = password.type === 'password'; password.type = visible ? 'text' : 'password'; event.currentTarget.setAttribute('aria-label', visible ? 'Ẩn mật khẩu' : 'Hiển thị mật khẩu'); event.currentTarget.innerHTML = `<i data-lucide="${visible ? 'eye-off' : 'eye'}" class="h-[18px] w-[18px]"></i>`; lucide.createIcons(); });
    [email, password].forEach(field => field.addEventListener('input', validate));
    form.addEventListener('submit', event => { event.preventDefault(); if (validate()) alert('Đăng nhập thành công! (Demo)'); });
  </script>
</body>
</html>
