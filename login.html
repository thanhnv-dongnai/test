<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập — Nền tảng của bạn</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: '#090A14',
            primary: '#DF6B33',
            'primary-light': '#F58A50'
          },
          fontFamily: {
            heading: ['Poppins', 'sans-serif'],
            body: ['Inter', 'sans-serif']
          },
          boxShadow: {
            glow: '0 0 0 1px rgba(223, 107, 51, 0.12), 0 24px 80px rgba(0, 0, 0, 0.35)'
          }
        }
      }
    }
  </script>

  <!-- Poppins cho tiêu đề, Inter cho nội dung -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet" />
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    html { color-scheme: dark; }
    body { background: #090A14; }
    .input-field:focus-within { box-shadow: 0 0 0 3px rgba(223, 107, 51, .14); }
    .social-button:hover { border-color: rgba(223, 107, 51, .65); background: rgba(223, 107, 51, .08); }
  </style>
</head>
<body class="min-h-screen bg-ink font-body text-slate-100 antialiased">
  <main class="relative flex min-h-screen items-center justify-center overflow-hidden px-4 py-8 sm:px-6">
    <!-- Ánh sáng nền trang trí -->
    <div aria-hidden="true" class="pointer-events-none absolute -left-32 -top-32 h-80 w-80 rounded-full bg-primary/10 blur-3xl"></div>
    <div aria-hidden="true" class="pointer-events-none absolute -bottom-40 -right-32 h-96 w-96 rounded-full bg-primary/10 blur-3xl"></div>

    <section class="relative w-full max-w-md">
      <div class="mb-8 text-center sm:mb-10">
        <div class="mx-auto mb-5 flex h-12 w-12 items-center justify-center rounded-2xl bg-primary text-white shadow-lg shadow-primary/20" aria-hidden="true">
          <i data-lucide="sparkles" class="h-6 w-6"></i>
        </div>
        <h1 class="font-heading text-2xl font-extrabold tracking-tight text-white sm:text-3xl">Chào mừng trở lại</h1>
        <p class="mt-2 text-sm leading-6 text-slate-400">Đăng nhập để tiếp tục sử dụng tài khoản của bạn</p>
      </div>

      <div class="rounded-2xl border border-white/[0.08] bg-white/[0.035] p-5 shadow-glow backdrop-blur-xl sm:rounded-3xl sm:p-8">
        <form id="login-form" action="#" method="post" novalidate class="space-y-5">
          <div>
            <label for="email" class="mb-2 block text-sm font-medium text-slate-200">Email</label>
            <div class="input-field flex items-center rounded-xl border border-white/[0.12] bg-black/20 transition focus-within:border-primary">
              <i data-lucide="mail" class="ml-3.5 h-[18px] w-[18px] shrink-0 text-slate-500"></i>
              <input id="email" name="email" type="email" autocomplete="email" required placeholder="ban@example.com" class="w-full min-w-0 bg-transparent px-3 py-3.5 text-sm text-white outline-none placeholder:text-slate-600" />
            </div>
            <div id="email-error" class="mt-1 text-xs text-red-400 flex items-center gap-1 opacity-0 transition-all">
              <i data-lucide="alert-triangle" class="h-3 w-3"></i>
              Email không hợp lệ
            </div>
          </div>

          <div>
            <div class="mb-2 flex items-center justify-between gap-3">
              <label for="mat-khau" class="block text-sm font-medium text-slate-200">Mật khẩu</label>
              <a href="#quen-mat-khau" class="text-xs font-medium text-primary-light transition hover:text-white focus:outline-none focus:ring-2 focus:ring-primary/50 focus:ring-offset-2 focus:ring-offset-ink">Quên mật khẩu?</a>
            </div>
            <div class="input-field flex items-center rounded-xl border border-white/[0.12] bg-black/20 transition focus-within:border-primary">
              <i data-lucide="lock-keyhole" class="ml-3.5 h-[18px] w-[18px] shrink-0 text-slate-500"></i>
              <input id="mat-khau" name="password" type="password" autocomplete="current-password" required placeholder="Nhập mật khẩu" class="w-full min-w-0 bg-transparent px-3 py-3.5 text-sm text-white outline-none placeholder:text-slate-600" />
              <button type="button" id="toggle-password" aria-label="Hiển thị mật khẩu" class="mr-2 rounded-lg p-2 text-slate-500 transition hover:text-slate-200 focus:outline-none focus:ring-2 focus:ring-primary/50">
                <i data-lucide="eye" class="h-[18px] w-[18px]"></i>
              </button>
            </div>
            <div id="password-error" class="mt-1 text-xs text-red-400 flex items-center gap-1 opacity-0 transition-all">
              <i data-lucide="alert-triangle" class="h-3 w-3"></i>
              Mật khẩu bắt buộc
            </div>
          </div>

          <div class="flex items-center">
            <input id="ghi-nho" name="remember" type="checkbox" class="h-4 w-4 cursor-pointer rounded border-white/20 bg-white/5 text-primary accent-primary focus:ring-2 focus:ring-primary/50" />
            <label for="ghi-nho" class="ml-2.5 cursor-pointer text-sm text-slate-400">Ghi nhớ đăng nhập</label>
          </div>

          <button type="submit" id="login-button" class="flex w-full items-center justify-center gap-2 rounded-xl bg-primary px-4 py-3.5 text-sm font-semibold text-white shadow-lg shadow-primary/20 transition hover:bg-primary-light focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-ink active:scale-[.99]">
            Đăng nhập
            <i data-lucide="arrow-right" class="h-[18px] w-[18px]"></i>
          </button>
        </form>

        <div class="my-7 flex items-center gap-3" aria-hidden="true">
          <div class="h-px flex-1 bg-white/[0.1]"></div>
          <span class="text-xs text-slate-500">Hoặc tiếp tục với</span>
          <div class="h-px flex-1 bg-white/[0.1]"></div>
        </div>

        <div class="grid grid-cols-3 gap-2.5 sm:gap-3">
          <button type="button" class="social-button flex items-center justify-center gap-2 rounded-xl border border-white/[0.12] bg-white/[0.025] px-2 py-3 text-sm font-medium text-slate-200 transition focus:outline-none focus:ring-2 focus:ring-primary/50" aria-label="Đăng nhập bằng Google">
            <i data-lucide="chrome" class="h-[18px] w-[18px]"></i><span class="hidden sm:inline">Google</span>
          </button>
          <button type="button" class="social-button flex items-center justify-center gap-2 rounded-xl border border-white/[0.12] bg-white/[0.025] px-2 py-3 text-sm font-medium text-slate-200 transition focus:outline-none focus:ring-2 focus:ring-primary/50" aria-label="Đăng nhập bằng GitHub">
            <i data-lucide="github" class="h-[18px] w-[18px]"></i><span class="hidden sm:inline">GitHub</span>
          </button>
          <button type="button" class="social-button flex items-center justify-center gap-2 rounded-xl border border-white/[0.12] bg-white/[0.025] px-2 py-3 text-sm font-medium text-slate-200 transition focus:outline-none focus:ring-2 focus:ring-primary/50" aria-label="Đăng nhập bằng Facebook">
            <i data-lucide="facebook" class="h-[18px] w-[18px]"></i><span class="hidden sm:inline">Facebook</span>
          </button>
        </div>
      </div>

      <p class="mt-7 text-center text-sm text-slate-500">Chưa có tài khoản?
        <a href="register.html" class="font-semibold text-primary-light transition hover:text-white focus:outline-none focus:ring-2 focus:ring-primary/50">Vui lòng đăng ký</a>
      </p>
    </section>
  </main>

  <script>
    lucide.createIcons();

    const togglePassword = document.getElementById('toggle-password');
    const passwordInput = document.getElementById('mat-khau');
    const loginForm = document.getElementById('login-form');
    const emailInput = document.getElementById('email');
    const emailError = document.getElementById('email-error');
    const passwordError = document.getElementById('password-error');

    // Toggle hiển thị mật khẩu
    togglePassword.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      togglePassword.setAttribute('aria-label', isPassword ? 'Ẩn mật khẩu' : 'Hiển thị mật khẩu');
      togglePassword.innerHTML = `<i data-lucide="${isPassword ? 'eye-off' : 'eye'}" class="h-[18px] w-[18px]"></i>`;
      lucide.createIcons();
    });

    // Validate email
    function validateEmail(email) {
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      return emailRegex.test(email);
    }

    // Hiển thị lỗi
    function showError(errorElement, message) {
      errorElement.textContent = '';
      errorElement.innerHTML = `<i data-lucide="alert-triangle" class="h-3 w-3"></i> ${message}`;
      errorElement.classList.remove('opacity-0');
      errorElement.classList.add('opacity-100');
      lucide.createIcons();
    }

    // Ẩn lỗi
    function hideError(errorElement) {
      errorElement.classList.remove('opacity-100');
      errorElement.classList.add('opacity-0');
    }

    // Validate khi blur khỏi email
    emailInput.addEventListener('blur', () => {
      const email = emailInput.value.trim();
      if (!email) {
        showError(emailError, 'Email bắt buộc');
        emailInput.parentElement.classList.add('border-red-500');
      } else if (!validateEmail(email)) {
        showError(emailError, 'Email không hợp lệ');
        emailInput.parentElement.classList.add('border-red-500');
      } else {
        hideError(emailError);
        emailInput.parentElement.classList.remove('border-red-500');
      }
    });

    // Validate khi blur khỏi password
    passwordInput.addEventListener('blur', () => {
      const password = passwordInput.value.trim();
      if (!password) {
        showError(passwordError, 'Mật khẩu bắt buộc');
        passwordInput.parentElement.classList.add('border-red-500');
      } else {
        hideError(passwordError);
        passwordInput.parentElement.classList.remove('border-red-500');
      }
    });

    // Xóa lỗi khi gõ
    emailInput.addEventListener('input', () => {
      if (emailInput.value.trim()) {
        hideError(emailError);
        emailInput.parentElement.classList.remove('border-red-500');
      }
    });

    passwordInput.addEventListener('input', () => {
      if (passwordInput.value.trim()) {
        hideError(passwordError);
        passwordInput.parentElement.classList.remove('border-red-500');
      }
    });

    // Submit form
    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();

      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();
      let isValid = true;

      // Validate email
      if (!email) {
        showError(emailError, 'Email bắt buộc');
        emailInput.parentElement.classList.add('border-red-500');
        isValid = false;
      } else if (!validateEmail(email)) {
        showError(emailError, 'Email không hợp lệ');
        emailInput.parentElement.classList.add('border-red-500');
        isValid = false;
      } else {
        hideError(emailError);
        emailInput.parentElement.classList.remove('border-red-500');
      }

      // Validate password
      if (!password) {
        showError(passwordError, 'Mật khẩu bắt buộc');
        passwordInput.parentElement.classList.add('border-red-500');
        isValid = false;
      } else {
        hideError(passwordError);
        passwordInput.parentElement.classList.remove('border-red-500');
      }

      // Nếu hợp lệ, submit form (hoặc gọi API)
      if (isValid) {
        console.log('Form submitted!', { email, password });
        // Thực hiện login logic ở đây
        alert('Đăng nhập thành công! (Demo)');
      }
    });
  </script>
</body>
</html>
